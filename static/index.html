<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipe Organ — Baroque Cathedral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="damask-overlay"></div>

  <div id="cathedral">

    <!-- ============================================================ -->
    <!--  Dome with lantern                                           -->
    <!-- ============================================================ -->
    <div id="dome-area">
      <div id="dome-lantern">
        <div id="lantern-base"></div>
        <div id="lantern-dome"></div>
        <div id="lantern-cross"></div>
      </div>
      <div id="dome">
        <div id="dome-coffers"></div>
        <div id="dome-ribs"></div>
        <div id="dome-oculus"></div>
        <div id="dome-glow"></div>
      </div>
    </div>

    <!-- ============================================================ -->
    <!--  Latin frieze + upper cornice                                -->
    <!-- ============================================================ -->
    <div id="frieze-latin">
      <span class="latin-text">S O L I&ensp;&middot;&ensp;D E O&ensp;&middot;&ensp;G L O R I A</span>
    </div>
    <div id="cornice-upper" class="cornice">
      <div class="cornice-moulding c1"></div>
      <div class="cornice-moulding c2"></div>
      <div class="cornice-moulding c3"></div>
      <div class="cornice-dentils"></div>
    </div>

    <!-- ============================================================ -->
    <!--  Clerestory — Rose window + flanking arches + spandrels      -->
    <!-- ============================================================ -->
    <div id="clerestory">
      <div id="spandrel-left" class="spandrel"><div class="spandrel-quatrefoil"></div></div>
      <div id="arch-left" class="side-arch"></div>
      <div id="rose-window-container">
        <div id="rose-window"><div id="rose-center"></div></div>
        <div id="rose-frame"></div>
        <div id="rose-glow"></div>
      </div>
      <div id="arch-right" class="side-arch"></div>
      <div id="spandrel-right" class="spandrel"><div class="spandrel-quatrefoil"></div></div>
    </div>

    <!-- ============================================================ -->
    <!--  Lower cornice                                               -->
    <!-- ============================================================ -->
    <div id="cornice-lower" class="cornice">
      <div class="cornice-dentils"></div>
      <div class="cornice-moulding c2"></div>
      <div class="cornice-moulding c1"></div>
    </div>

    <!-- ============================================================ -->
    <!--  Acanthus frieze (above organ wall)                          -->
    <!-- ============================================================ -->
    <div id="acanthus-frieze-top" class="acanthus-band"></div>

    <!-- ============================================================ -->
    <!--  THE ORGAN WALL — three-bay cathedral composition            -->
    <!--  Left tower (Choir+Great pipes) · Center console ·           -->
    <!--  Right tower (Swell+Solo pipes) — symmetric, grandiose       -->
    <!-- ============================================================ -->
    <div id="organ-wall">

      <!-- ===== LEFT PIPE TOWER — Choir & Great divisions ===== -->
      <div id="tower-left" class="pipe-tower">
        <!-- Angel statue atop tower -->
        <div class="angel angel-left">
          <div class="angel-halo"></div>
          <div class="angel-head"></div>
          <div class="angel-wing wing-l"><div class="wing-feathers"></div></div>
          <div class="angel-wing wing-r"><div class="wing-feathers"></div></div>
          <div class="angel-body">
            <div class="angel-robe-fold"></div>
          </div>
          <div class="angel-trumpet">
            <div class="trumpet-bell"></div>
          </div>
        </div>
        <!-- Tower crown / pediment -->
        <div class="tower-crown">
          <div class="tower-crown-scroll scroll-l"></div>
          <div class="tower-pediment"></div>
          <div class="tower-crown-scroll scroll-r"></div>
          <div class="tower-crown-crest"></div>
        </div>
        <!-- Tower division label -->
        <div class="tower-div-label">Choir · Great</div>
        <!-- Entablature above pipe case -->
        <div class="tower-entablature">
          <div class="entablature-architrave"></div>
          <div class="entablature-frieze"></div>
          <div class="entablature-cornice"></div>
        </div>
        <!-- Pipe case with architectural frame -->
        <div class="pipe-case">
          <!-- Outer pilaster (left edge, toward church wall) -->
          <div class="pilaster pilaster-outer">
            <div class="pilaster-cap"></div>
            <div class="pilaster-shaft"><div class="pilaster-fluting"></div></div>
            <div class="pilaster-base-mould"></div>
          </div>
          <!-- Dark recessed case interior + façade pipes -->
          <div class="pipe-case-interior">
            <div class="pipe-case-shadow"></div>
            <div id="tower-left-pipes" class="tower-pipe-ranks">
              <!-- JS fills Choir + Great playable pipes -->
            </div>
          </div>
          <!-- Inner pilaster (toward center console) -->
          <div class="pilaster pilaster-inner">
            <div class="pilaster-cap"></div>
            <div class="pilaster-shaft"><div class="pilaster-fluting"></div></div>
            <div class="pilaster-base-mould"></div>
          </div>
        </div>
        <!-- Statue niche below pipe case -->
        <div class="tower-niche tower-niche-lower">
          <div class="niche-arch"></div>
          <div class="niche-statue"></div>
          <div class="niche-pedestal"></div>
        </div>
        <!-- Base ornament -->
        <div class="tower-base">
          <div class="tower-base-moulding"></div>
          <div class="tower-base-cartouche"></div>
        </div>
      </div>

      <!-- ===== CENTER BAY — Console only ===== -->
      <div id="center-bay">
        <!-- Ornamental crown above console -->
        <div class="console-crown">
          <div class="console-crown-scroll"></div>
          <div class="console-crown-medallion">
            <span class="medallion-text">Soli Deo Gloria</span>
          </div>
          <div class="console-crown-scroll"></div>
        </div>

        <!-- Music rack -->
        <div id="music-rack">
          <div id="music-rack-frame">
            <div class="rack-ornament rack-orn-l"></div>
            <div class="rack-ornament rack-orn-r"></div>
            <div id="music-shelf"></div>
          </div>
        </div>

        <!-- Stop board -->
        <div id="stop-board">
          <span class="stop-label stop-choir">Choir &mdash; Dulciana</span>
          <span class="stop-label stop-great">Great &mdash; Principal</span>
          <span class="stop-label stop-swell">Swell &mdash; Flute</span>
          <span class="stop-label stop-solo">Solo &mdash; Trompette</span>
        </div>

        <!-- Keyboard stack -->
        <div id="keyboard-stack">
          <!-- JS fills .keyboard-row × 4 -->
        </div>

        <!-- Console cheeks (end blocks) -->
        <div class="console-cheek console-cheek-l"><div class="cheek-scroll"></div></div>
        <div class="console-cheek console-cheek-r"><div class="cheek-scroll"></div></div>

        <!-- Console base moulding -->
        <div class="console-base-inner"></div>
      </div>

      <!-- ===== RIGHT PIPE TOWER — Swell & Solo divisions ===== -->
      <div id="tower-right" class="pipe-tower">
        <div class="angel angel-right">
          <div class="angel-halo"></div>
          <div class="angel-head"></div>
          <div class="angel-wing wing-l"><div class="wing-feathers"></div></div>
          <div class="angel-wing wing-r"><div class="wing-feathers"></div></div>
          <div class="angel-body">
            <div class="angel-robe-fold"></div>
          </div>
          <div class="angel-trumpet">
            <div class="trumpet-bell"></div>
          </div>
        </div>
        <div class="tower-crown">
          <div class="tower-crown-scroll scroll-l"></div>
          <div class="tower-pediment"></div>
          <div class="tower-crown-scroll scroll-r"></div>
          <div class="tower-crown-crest"></div>
        </div>
        <!-- Tower division label -->
        <div class="tower-div-label">Swell · Solo</div>
        <!-- Entablature above pipe case -->
        <div class="tower-entablature">
          <div class="entablature-architrave"></div>
          <div class="entablature-frieze"></div>
          <div class="entablature-cornice"></div>
        </div>
        <!-- Pipe case with architectural frame -->
        <div class="pipe-case">
          <!-- Inner pilaster (toward center console) -->
          <div class="pilaster pilaster-inner">
            <div class="pilaster-cap"></div>
            <div class="pilaster-shaft"><div class="pilaster-fluting"></div></div>
            <div class="pilaster-base-mould"></div>
          </div>
          <!-- Dark recessed case interior + façade pipes -->
          <div class="pipe-case-interior">
            <div class="pipe-case-shadow"></div>
            <div id="tower-right-pipes" class="tower-pipe-ranks">
              <!-- JS fills Swell + Solo playable pipes -->
            </div>
          </div>
          <!-- Outer pilaster (right edge, toward church wall) -->
          <div class="pilaster pilaster-outer">
            <div class="pilaster-cap"></div>
            <div class="pilaster-shaft"><div class="pilaster-fluting"></div></div>
            <div class="pilaster-base-mould"></div>
          </div>
        </div>
        <div class="tower-niche tower-niche-lower">
          <div class="niche-arch"></div>
          <div class="niche-statue"></div>
          <div class="niche-pedestal"></div>
        </div>
        <div class="tower-base">
          <div class="tower-base-moulding"></div>
          <div class="tower-base-cartouche"></div>
        </div>
      </div>

    </div><!-- /organ-wall -->

    <!-- ============================================================ -->
    <!--  Lower ornamental band                                       -->
    <!-- ============================================================ -->
    <div id="egg-dart-band">
      <div class="egg-dart-pattern"></div>
      <div class="egg-dart-line"></div>
    </div>

    <!-- ============================================================ -->
    <!--  Organ base plinth                                           -->
    <!-- ============================================================ -->
    <div id="organ-plinth">
      <div class="plinth-moulding"></div>
    </div>

    <!-- ============================================================ -->
    <!--  Controls + hint (below the organ wall)                      -->
    <!-- ============================================================ -->
    <div id="controls">
      <button id="tremulant-btn" title="Toggle Tremulant">Tremulant: Off</button>
      <span id="voice-count" class="voice-indicator"></span>
    </div>

    <div id="hint">Press keys A&ndash;Z, 1&ndash;9, 0, -, =, ;, &rsquo;, ,, ., / to play</div>

  </div><!-- /cathedral -->

  <script src="organ.js"></script>
  <script src="main.js"></script>
</body>
</html>
