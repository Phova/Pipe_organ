<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipe Organ — Cathedral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cathedral scene -->
  <div id="cathedral">

    <!-- Dome / vaulted ceiling -->
    <div id="dome">
      <div id="dome-inner"></div>
    </div>

    <!-- Rose window -->
    <div id="rose-window-container">
      <div id="rose-window">
        <div id="rose-center"></div>
      </div>
    </div>

    <!-- Pillars -->
    <div id="pillar-left" class="pillar"></div>
    <div id="pillar-right" class="pillar"></div>

    <!-- Pipe organ facade -->
    <div id="organ-facade">
      <div id="pipes-container">
        <!-- 26 pipes generated by JS -->
      </div>
    </div>

    <!-- Note labels -->
    <div id="note-labels"></div>

    <!-- Keyboard -->
    <div id="keyboard-container">
      <div id="keyboard"></div>
    </div>

    <!-- Tremulant toggle -->
    <div id="controls">
      <button id="tremulant-btn" title="Toggle Tremulant (vibrato effect)">Tremulant: Off</button>
    </div>

    <!-- Hint -->
    <div id="hint">Press letter keys A&ndash;Z to play the organ</div>

  </div>

  <script src="organ.js"></script>
  <script src="main.js"></script>
</body>
</html>
